[package]
name = "city-render"
description = "Presentation layer: terrain mesh, instanced buildings, roads, LOD, atmosphere. Reads sim views, never mutates them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Le viewer n'est pas compilé par défaut : `cargo test` reste à 3 s sans tirer
# Bevy. Activation : `cargo run -p citymayor-app --features viewer --bin city-viewer`.
viewer = ["dep:bevy"]

[dependencies]
sim-core = { workspace = true }
# Bevy 0.20 : features explicites pour ne pas compiler audio/GLTF/physics dont
# on n'a pas besoin. `x11` + `wayland` couvrent les deux serveurs graphiques.
bevy = { version = "0.20.1", optional = true, default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "wayland",
    "x11",
] }

[lints]
workspace = true
